services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vault
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once when the data volume is first created.
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: only the app container can reach the database.
    networks: [internal]

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vault:${POSTGRES_PASSWORD}@postgres:5432/vault
      VAULT_ROOT: /vault
    # Same UID/GID as the Syncthing user on the host so written files belong to it.
    user: "${VAULT_UID:-1000}:${VAULT_GID:-1000}"
    volumes:
      - ${VAULT_HOST_PATH:?set VAULT_HOST_PATH in .env}:/vault
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    # Only reachable from the Pi itself; Tailscale Funnel proxies to it.
    ports:
      - "127.0.0.1:17484:3000"
    networks: [internal, egress, anki]

  # Headless Anki (AnkiConnect + AnkiMCP add-on), syncing with AnkiWeb.
  # Reachable only by the app (network "anki"); never published except VNC on
  # the Pi's loopback for the one-time AnkiWeb login via SSH tunnel.
  anki:
    build: ./anki
    restart: unless-stopped
    environment:
      PUID: ${VAULT_UID:-1000}
      PGID: ${VAULT_GID:-1000}
      ANKI_MCP_HOST: 0.0.0.0
      ANKI_MCP_PORT: "3141"
      ANKI_MCP_API_KEY: ${ANKI_MCP_API_KEY:?set ANKI_MCP_API_KEY in .env}
      ANKI_MCP_ALLOWED_HOSTS: anki:3141
      ANKICONNECT_BIND: 0.0.0.0
      # Second line of defence behind the gateway's own filter.
      ANKI_MCP_DISABLED_TOOLS: create_model,model_fields,update_model_styling,update_model_templates,change_note_type,gui_add_cards,gui_browse,gui_current_card,gui_deck_browser,gui_edit_note,gui_select_card,gui_show_answer,gui_show_question,gui_undo,gui_answer_card,gui_deck_review
    # Anki-only secrets (AnkiConnect key, VNC password) live here, not in the app's .env.
    env_file: anki.env
    security_opt: ["no-new-privileges:true"]
    cap_drop: [NET_RAW, MKNOD, SYS_CHROOT, SETFCAP, AUDIT_WRITE, NET_BIND_SERVICE]
    volumes:
      - ankidata:/data
    # VNC is only needed for the one-time AnkiWeb login. Re-enable temporarily with
    #   ports: ["127.0.0.1:5901:5900"]
    # and tunnel: ssh -N -L 5901:127.0.0.1:5901 <user>@<host>
    networks: [anki, anki-egress]

  # Own tailnet node "vault" so the server gets https://vault.<tailnet>.ts.net on port 443
  # (Claude's connector backend does not reach Funnel on 8443). Exposes only the app.
  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: vault
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: vault
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ACCEPT_DNS: "false"
    volumes:
      - tsstate:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on: [app]
    networks: [egress]

networks:
  internal:
    internal: true
  egress: {}
  # app <-> anki only
  anki:
    internal: true
  # anki -> AnkiWeb sync. Fixed subnet: anki/firewall/ blocks it from reaching the
  # LAN, the tailnet and the Pi itself (the add-on's URL check can be bypassed).
  anki-egress:
    ipam:
      config:
        - subnet: 172.30.99.0/24

volumes:
  pgdata:
  tsstate:
  ankidata:
